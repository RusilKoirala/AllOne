<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="/AllOne/public/assets/ToolsHub.png" type="image/png">
</head>
<body>
  <div class="page-wrapper">
    <!-- Left/Main Content -->
    <div class="main-content">
      <!-- Navbar -->
      <nav>
        <div class="logo">
          <a href="index.html">Tools<span>Hub</span></a>
        </div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="tools.html">Tools</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>

      <!-- Unit Converter Section -->
      <section class="unit-converter">
        <h1>Unit Converter</h1>
        <div class="unit-converter-container">
          <div class="select-section">
            <label for="category">Category:</label>
            <select id="category" onchange="updateUnits()">
              <option value="length">Length</option>
              <option value="temperature">Temperature</option>
              <option value="weight">Weight</option>
            </select>
          </div>

          <div class="select-section">
            <label for="fromUnit">From:</label>
            <select id="fromUnit"></select>
          </div>

          <div class="select-section">
            <label for="toUnit">To:</label>
            <select id="toUnit"></select>
          </div>

          <div class="input-section">
            <label for="value">Value:</label>
            <input type="number" id="value" placeholder="Enter value" />
          </div>

          <div class="result-section">
            <button onclick="convert()">Convert</button>
            <p id="result">Result:</p>
          </div>
        </div>
      </section>
    </div>

    <!-- Right Banner with Adsterra Code -->
    <div class="right-banner">
      <script type="text/javascript">
        atOptions = {
          'key': 'e5de58434fd88c1c0accc481122984d3',
          'format': 'iframe',
          'height': 600,
          'width': 160,
          'params': {}
        };
      </script>
      <script type="text/javascript" src="//www.highperformanceformat.com/e5de58434fd88c1c0accc481122984d3/invoke.js"></script>
    </div>
  </div>

</body>
