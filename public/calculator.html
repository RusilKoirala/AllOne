<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="/AllOne/public/assets/ToolsHub.png" type="image/png">
</head>
<body>
    <div class="page-wrapper">
        <!-- Left/Main Content -->
        <div class="main-content">
            <!-- Navbar -->
            <nav>
                <div class="logo">
                    <a href="index.html">Tools<span>Hub</span></a>
                </div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="tools.html">Tools</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </div>
            </nav>

            <!-- Calculator Section -->
            <section class="calculator">
                <h1>Calculator</h1>
                <div class="calculator-container">
                    <input type="text" id="display" class="display" disabled />
                    <div class="calculator-buttons">
                        <button class="btn" onclick="appendNumber('7')">7</button>
                        <button class="btn" onclick="appendNumber('8')">8</button>
                        <button class="btn" onclick="appendNumber('9')">9</button>
                        <button class="btn" onclick="setOperation('/')">/</button>

                        <button class="btn" onclick="appendNumber('4')">4</button>
                        <button class="btn" onclick="appendNumber('5')">5</button>
                        <button class="btn" onclick="appendNumber('6')">6</button>
                        <button class="btn" onclick="setOperation('*')">*</button>

                        <button class="btn" onclick="appendNumber('1')">1</button>
                        <button class="btn" onclick="appendNumber('2')">2</button>
                        <button class="btn" onclick="appendNumber('3')">3</button>
                        <button class="btn" onclick="setOperation('-')">-</button>

                        <button class="btn" onclick="appendNumber('0')">0</button>
                        <button class="btn" onclick="clearDisplay()">C</button>
                        <button class="btn" onclick="calculate()">=</button>
                        <button class="btn" onclick="setOperation('+')">+</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Right Banner with Adsterra Code -->
        <div class="right-banner">
            <script type="text/javascript">
                atOptions = {
                    'key': 'e5de58434fd88c1c0accc481122984d3',
                    'format': 'iframe',

                };
            </script>
            <script type="text/javascript" src="//www.highperformanceformat.com/e5de58434fd88c1c0accc481122984d3/invoke.js"></script>
        </div>
    </div>

    <footer>

    </footer>

    <script src="js/calculator.js"></script>
</body>
</html>
